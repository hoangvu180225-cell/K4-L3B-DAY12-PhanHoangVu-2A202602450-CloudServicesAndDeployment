name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY || 'ci-key' }}
          REDIS_URL: fake://
        run: |
          pytest tests/ --ignore=tests/test_cp5.py -v -m "not docker"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t day12-agent:latest .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploying to production using secure webhook secret..."
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured, skipping webhook call."
          fi
